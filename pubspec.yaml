name: openpanel_client
description: >-
  OpenPanel analytics for Flutter apps on every platform: events, screens and
  profiles, queued on disk while offline and sent in order with their real
  time. Pure-Dart core; device detection and navigation helpers for Flutter.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  device_info_plus: ^13.0.0
  flutter:
    sdk: flutter
  http: ^1.5.0
  meta: ^1.16.0
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
